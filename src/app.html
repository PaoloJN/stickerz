<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="%site.author%" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" sizes="48x48" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <!-- Preload Fonts -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/Geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/GeistMono.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Manifest -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

    %sveltekit.head%
  </head>
  <body
    class="overscroll-none bg-neutral-100 font-sans text-neutral-900 antialiased selection:bg-neutral-300 dark:bg-neutral-950 dark:text-neutral-200 dark:selection:bg-neutral-700"
    data-sveltekit-preload-data="hover"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
