<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
<helmet><style>
body{margin:0;background:#fafaf9;font-family:"Geist",ui-sans-serif,system-ui,sans-serif;color:#111214;-webkit-font-smoothing:antialiased}
a{color:#111214}a:hover{color:#5f6166}
</style></helmet>
<div data-screen-label="404" style="min-width:1120px;min-height:100vh;display:flex;flex-direction:column;background:#fafaf9;color:#111214;font-size:14px">
  <!-- shared chrome: announcement bar, stats bar (no "stacks liked" here), nav — identical to Home -->
  <div style="background:#111214;color:#fff">
    <div style="width:1120px;margin:0 auto;box-sizing:border-box;height:34px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;font-size:12.5px">
      <span style="font-family:'GeistMono',monospace;font-size:10px;letter-spacing:.08em;font-weight:500;color:#111214;background:#fff;border-radius:4px;padding:2px 6px">FOR BRANDS</span>
      <span style="color:#c8c8c4">Your logo is already on developers’ lids. Make it official.</span>
      <a href="Stack Stickers Support v2.dc.html#brands" style="color:#fff;font-weight:500;text-decoration:none;display:flex;gap:5px" style-hover="color:#fff;opacity:.75">Verified logos and Sponsored spots<span>→</span></a>
    </div>
  </div>
  <div style="border-bottom:1px solid #e6e6e3">
    <div style="width:1120px;margin:0 auto;box-sizing:border-box;height:64px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 24px;border-left:1px solid #e6e6e3;border-right:1px solid #e6e6e3">
      <a href="Stack Stickers Home.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;color:#111214"><img src="static/library/svgl.svg" style="width:20px;height:20px" alt=""><span style="font-weight:600;font-size:15px;letter-spacing:-.01em">Stack Stickers</span></a>
      <div style="display:flex;gap:2px"><a href="Stack Stickers Gallery.dc.html" style="padding:6px 12px;border-radius:7px;font-size:13.5px;color:#5f6166;text-decoration:none" style-hover="color:#111214;background:#f0f0ee">Gallery</a><a href="Stack Stickers Logos.dc.html" style="padding:6px 12px;border-radius:7px;font-size:13.5px;color:#5f6166;text-decoration:none" style-hover="color:#111214;background:#f0f0ee">Logos</a><a href="Stack Stickers Docs.dc.html" style="padding:6px 12px;border-radius:7px;font-size:13.5px;color:#5f6166;text-decoration:none" style-hover="color:#111214;background:#f0f0ee">Docs</a><a href="Stack Stickers Support v2.dc.html" style="padding:6px 12px;border-radius:7px;font-size:13.5px;color:#5f6166;text-decoration:none;display:flex;align-items:center;gap:6px" style-hover="color:#111214;background:#f0f0ee"><span style="color:#e2554a;font-size:12px">♥</span>Support</a></div>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px"><a href="Stack Stickers Editor.dc.html" style="height:34px;padding:0 13px;display:flex;align-items:center;border-radius:8px;background:#111214;color:#fff;font-weight:500;font-size:13.5px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)" style-hover="background:#2a2c30;color:#fff">Make your lid</a></div>
    </div>
  </div>

  <div style="width:1120px;margin:0 auto;box-sizing:border-box;border-left:1px solid #e6e6e3;border-right:1px solid #e6e6e3;flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 32px 112px;gap:20px;background-image:radial-gradient(#e2e2de 1px,transparent 1px);background-size:18px 18px">
    <sc-for list="{{ stickers }}" as="s" hint-placeholder-count="0">
      <div onMouseEnter="{{ s.enter }}" onMouseLeave="{{ s.leave }}" style="{{ s.box }}"><img src="{{ s.src }}" style="{{ s.img }}" alt=""></div>
    </sc-for>
    <span style="position:relative;font-size:200px;font-weight:600;letter-spacing:-.07em;line-height:.85;color:#0b1220">404</span>
    <span style="position:relative;font-size:28px;font-weight:600;letter-spacing:-.03em">This page peeled off</span>
    <span style="position:relative;font-size:16px;line-height:1.55;color:#5f6166;max-width:420px;text-wrap:pretty">The link might be old or mistyped. Try one of these instead.</span>
    <div style="position:relative;display:flex;gap:8px;padding-top:8px">
      <a href="Stack Stickers Home.dc.html" style="height:42px;padding:0 16px;display:flex;align-items:center;border-radius:10px;background:#111214;color:#fff;font-weight:500;font-size:14px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)" style-hover="background:#2a2c30;color:#fff">Back to home</a>
      <a href="Stack Stickers Logos.dc.html" style="height:42px;padding:0 16px;box-sizing:border-box;display:flex;align-items:center;border-radius:10px;background:#fff;border:1px solid rgba(17,18,20,.12);font-weight:500;font-size:14px;text-decoration:none" style-hover="background:#f3f3f1;color:#111214">Browse logos</a>
      <a href="Stack Stickers Gallery.dc.html" style="height:42px;padding:0 16px;box-sizing:border-box;display:flex;align-items:center;border-radius:10px;background:#fff;border:1px solid rgba(17,18,20,.12);font-weight:500;font-size:14px;text-decoration:none" style-hover="background:#f3f3f1;color:#111214">Gallery</a>
    </div>
  </div>

  <!-- shared footer: identical to Home -->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // [file, left %, top %, size px, rotate deg]
  SPOTS = [
    ['vercel.svg', 22, 24, 64, -12], ['react_light.svg', 78, 20, 72, 10], ['tailwindcss.svg', 86, 58, 56, -8],
    ['figma.svg', 12, 62, 58, 9], ['supabase.svg', 30, 84, 50, -6], ['linear.svg', 70, 84, 54, 14],
    ['github_light.svg', 38, 14, 44, 6], ['bun.svg', 62, 12, 46, -10]
  ];
  state = {hov: null};
  dieCut(w, extra = '') { const d = w * .71; return [[w,0],[-w,0],[0,w],[0,-w],[d,d],[-d,d],[d,-d],[-d,-d]].map(([x, y]) => `drop-shadow(${x}px ${y}px 0 #fff)`).join(' ') + ' drop-shadow(0 1px 1px rgba(20,30,40,.18)) drop-shadow(0 4px 8px rgba(20,30,40,.12))' + extra; }
  renderVals() {
    const hov = this.state.hov;
    return {
      stickers: this.SPOTS.map(([f, x, y, s, rot], i) => { const h = hov === i;
        return {src: 'static/library/' + f, enter: () => this.setState({hov: i}), leave: () => this.setState(st => st.hov === i ? {hov: null} : null),
          box: {position: 'absolute', left: x + '%', top: y + '%', width: s, height: s, cursor: 'grab',
            // hover: straighten most of the rotation, lift 6px, scale 1.12
            transform: `translate(-50%,-50%) rotate(${h ? Math.round(rot * .3) : rot}deg) translateY(${h ? -6 : 0}px) scale(${h ? 1.12 : 1})`,
            transition: 'transform .4s cubic-bezier(.2,1.6,.4,1)'},
          img: {width: '100%', height: '100%', objectFit: 'contain', filter: this.dieCut(3, h ? ' drop-shadow(0 14px 16px rgba(20,30,40,.18))' : '')}}; })
    };
  }
}
</script>
</body>
</html>
